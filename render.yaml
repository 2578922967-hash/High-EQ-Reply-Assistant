services:
  - type: web
    name: high-eq-reply-assistant
    runtime: python
    plan: free
    rootDir: code
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend_api:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: LLM_DEFAULT_MODEL
        value: qwen3.8-max
      - key: LLM_API_KEY
        sync: false
